name: wandergeo
description: WanderGeo - Passport to the World (Tugas Akhir Pemrograman Aplikasi Mobile)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  google_fonts: ^6.2.1
  supabase_flutter: ^2.8.0
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  geolocator: ^13.0.2
  flutter_compass: ^0.8.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.14.1

# Splash bawaan OS (sebelum splash animasi Flutter). Jalankan:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#F4F8FA"
  android_12:
    color: "#F4F8FA"

# Ikon aplikasi (logo W). Jalankan:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0E2238"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
